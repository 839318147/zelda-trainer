<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>塞尔达修改器 · 更新站</title>
<style>
  body { background:#111318; color:#e6e8ee; font-family:"Microsoft YaHei UI",sans-serif; margin:0; padding:32px; }
  h1 { font-size:22px; margin:0 0 6px; }
  .sub { color:#8b8e96; font-size:13px; margin-bottom:24px; }
  .card { background:#1b1e25; border-radius:10px; padding:20px 24px; margin-bottom:18px; }
  .ver { font-size:28px; color:#d67864; font-weight:600; }
  .meta { color:#9a9da6; font-size:13px; line-height:1.9; }
  code { background:#24272f; padding:2px 6px; border-radius:4px; font-size:12px; word-break:break-all; }
  a.btn { display:inline-block; margin-top:14px; background:#d64a38; color:#fff; text-decoration:none;
          padding:10px 22px; border-radius:6px; font-size:14px; }
  a.btn:hover { background:#e25a46; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:7px 8px; border-bottom:1px solid #2a2d35; }
  th { color:#9a9da6; font-weight:500; }
  .hint { color:#7c7f88; font-size:12px; margin-top:16px; line-height:1.8; }
</style>
</head>
<body>
  <h1>塞尔达修改器 · 更新站</h1>
  <div class="sub">Savage Wind Recomp Trainer · 自动读取最新版本信息</div>

  <div class="card">
    <div class="ver" id="ver">读取中…</div>
    <div class="meta" id="meta"></div>
    <a class="btn" href="SavageWindTrainer.exe">下载最新版</a>
    <a class="btn" href="源码.zip" style="background:#3a3f4a">下载源码</a>
  </div>

  <div class="card">
    <div class="meta" style="margin-bottom:10px">更新历史</div>
    <table id="hist"><tr><th>版本</th><th>大小</th><th>说明</th></tr></table>
  </div>

  <div class="hint">
    修改器里点「检查更新」会自动读取 <code>version.json</code> 并比对 SHA256，有新版就下载替换。<br>
    本页内容全部来自 <code>version.json</code> 和 <code>history.txt</code>，无需改动本文件。
  </div>

<script>
(async function () {
  try {
    const r = await fetch('version.json?t=' + Date.now());
    const j = await r.json();
    document.getElementById('ver').textContent = j.version;
    document.getElementById('meta').innerHTML =
      '构建时间：' + j.builtAt + '<br>' +
      '文件大小：' + j.sizeKB + ' KB<br>' +
      '更新说明：' + (j.note || '') + '<br>' +
      'SHA256：<code>' + j.sha256 + '</code>';
  } catch (e) {
    document.getElementById('ver').textContent = '读取 version.json 失败';
    document.getElementById('meta').textContent = e;
  }
  try {
    const r2 = await fetch('history.txt?t=' + Date.now());
    if (!r2.ok) return;
    const txt = await r2.text();
    const tbody = document.getElementById('hist');
    txt.trim().split('\n').slice(-30).reverse().forEach(function (line) {
      const p = line.split('\t');
      if (p.length < 3) return;
      const tr = document.createElement('tr');
      p.forEach(function (v) { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); });
      tbody.appendChild(tr);
    });
  } catch (e) { }
})();
</script>
</body>
</html>
